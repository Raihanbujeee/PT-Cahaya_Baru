; Konfigurasi PHP tambahan untuk runtime vercel-php.
; File ini otomatis digabung ke php.ini saat build di Vercel dan tidak
; berpengaruh apa pun saat development lokal.

memory_limit = 256M

; Vercel membatasi body request ±4,5 MB, jadi batas upload disetel di bawah itu.
upload_max_filesize = 4M
post_max_size = 5M

; Tampilkan error sebagai output (bukan HTML) supaya tidak merusak response JSON.
display_errors = Off
